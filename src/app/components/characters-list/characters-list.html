<div class="characters-wrapper">
  @for(character of charactersFromApi; track character.id){
    <div class="character-card">
      <h1>{{ character.fullName }}</h1>
      <p>{{ character.title }}</p>
      <strong>{{ character.family }}</strong>
    </div>
  } @empty {
    <p>Aucun personnage disponible</p>
  }
</div>

<p>{{ stringToShow }}</p>
